name: Refresh street tree data

on:
  schedule:
    # ~06:00-07:00 America/Toronto, daily, like the multiplex map. The City refreshes this
    # dataset "as available" (June 4, then Nov 23, 2026), on no fixed day, so the run checks
    # every morning and the `check` job skips the build unless the City's stamp has moved.
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  # Compares the City's last_refreshed stamp with the one in the live trees.meta.json.
  # Pushes and manual runs always build; only the daily schedule is gated on this.
  check:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.freshness.outputs.stale }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - id: freshness
        name: Compare City refresh stamp with the live site
        run: python ingest/check_freshness.py

  build:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch street tree inventory
        run: python ingest/fetch_trees.py

      - name: Fetch ward boundaries
        run: python ingest/fetch_reference.py

      # Street network, census geography and the tree-to-geography joins the three
      # analysis maps are built on. The centreline download is cached between runs by
      # the step's own check; the census table is a fixed 2021 file.
      - name: Build analysis geography
        run: python analysis/ingest_geo.py

      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Export the map payload
        run: python export/export_map_data.py

      - name: Export the analysis payloads
        run: python analysis/export_analysis.py

      - name: Check the payload is complete
        run: python export/check_payload.py

      # site/config.js is gitignored, so the deployed copy is written here from the secret.
      # Without it the map falls back to Esri's keyless basemap rather than to CARTO's
      # "API KEY REQUIRED" watermark tile.
      # Also where the "Report a problem" link is switched on: it only appears when
      # TREE_REPORT_URL is set. Both values are public (the browser sends them anyway);
      # the Worker behind them is corrections/worker/.
      - name: Write site config
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          if [ -z "$CARTO_API_KEY" ]; then
            echo "::warning::CARTO_API_KEY secret is not set; falling back to the Esri basemap."
          fi
          {
            echo "window.CARTO_API_KEY = \"$CARTO_API_KEY\";"
            echo 'window.TREE_REPORT_URL = "https://tree-reports.tree-reports.workers.dev/report";'
            echo 'window.TURNSTILE_SITE_KEY = "0x4AAAAAAGUnV-F5aLvaMzIf";'
          } > site/config.js

      - uses: actions/configure-pages@v5

      # site/data is built here rather than committed: the payload is ~6 MB of binary
      # columns, and committing it on every refresh would grow the repo by that much each
      # time. Pages serves the artifact, so nothing needs to be in git.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
