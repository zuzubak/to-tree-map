<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toronto Street Tree Map &mdash; Every Street Tree, Native or Not</title>
  <meta name="description" content="An interactive map of all 688,335 trees in Toronto's street tree inventory, coloured by whether each one is native to Ontario, by trunk size, or by species. Filter by origin, genus, species, trunk diameter and ward. Built from City of Toronto Open Data.">
  <link rel="canonical" href="https://malcolmkennedy.com/to-tree-map/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Malcolm Kennedy">
  <meta property="og:url" content="https://malcolmkennedy.com/to-tree-map/">
  <meta property="og:title" content="Toronto Street Tree Map &mdash; Every Street Tree, Native or Not">
  <meta property="og:description" content="All 688,335 trees in Toronto's street tree inventory, coloured by whether each one is native to Ontario. 38.9% are; Norway maple alone is a tenth of the city's street trees, and invasive.">
  <meta property="og:image" content="https://malcolmkennedy.com/to-tree-map/og-image.png">
  <meta property="og:image:width" content="1872">
  <meta property="og:image:height" content="936">
  <meta property="og:image:alt" content="Map of midtown Toronto with a coloured dot for every street tree, green for native to Ontario, blue for introduced, orange for invasive.">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="/header.js"></script>
  <div class="app">
    <main id="map-pane">
      <div id="map"></div>
      <div class="map-badge" id="loading-badge">
        <span class="spinner" aria-hidden="true"></span>
        <span id="loading-text">Loading 690,000 trees&hellip;</span>
      </div>
    </main>

    <aside class="panel" id="panel">
      <div class="panel-handle-row">
        <button class="panel-drag-handle" id="panel-toggle" aria-label="Toggle filter panel" aria-expanded="false">
          <span class="handle-bar"></span>
          <span class="handle-label">Stats &amp; filters</span>
        </button>
        <button class="panel-hide-btn" id="panel-hide" aria-label="Hide panel and show map">
          Hide &#9660;
        </button>
      </div>

      <div class="panel-scroll">
        <header class="panel-header">
          <h1>Toronto Street Tree Map</h1>
          <span class="subtitle" id="last-updated">Loading&hellip;</span>
          <div class="stats" id="stats"></div>
        </header>

        <!-- Chips, the ward checkboxes and the diameter slider are rendered by
             map.js from one table, the same way the permit map renders its bar. -->
        <div class="filter-bar" id="filter-bar"></div>

        <div class="legend" id="map-legend"></div>

        <section class="legend">
          <h2>Most common trees</h2>
          <div id="taxa-table"></div>
        </section>

      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Written at deploy time from the CARTO_API_KEY secret; absent locally, which is fine. -->
  <script src="config.js"></script>
  <script src="map.js"></script>

  <!-- Pageview counts only (GoatCounter): no cookies, so no consent banner needed. -->
  <script data-goatcounter="https://zuzubak.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
