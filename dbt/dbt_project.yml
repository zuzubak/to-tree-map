name: 'to_tree_map'
version: '1.0.0'
config-version: 2

profile: 'to_tree_map'

model-paths: ["models"]
seed-paths: ["seeds"]

models:
  to_tree_map:
    +materialized: table

seeds:
  to_tree_map:
    +quote_columns: false
    native_status:
      +column_types:
        taxon: varchar
        rank: varchar
        native_status: varchar
        invasive: boolean
        origin: varchar
        notes: varchar
    genus_labels:
      +column_types:
        genus: varchar
        genus_common: varchar
    da_canopy:
      +column_types:
        dauid: varchar
        canopy_m2: double
    da_landcover:
      +column_types:
        dauid: varchar
    name_corrections:
      +column_types:
        raw_lower: varchar
        canonical_name: varchar
        reason: varchar
    # Reader-reported fixes, approved by hand. One row per approved report; see
    # models/staging/int_tree_corrections.sql for how each is reconciled against a refresh.
    tree_corrections:
      +column_types:
        correction_id: varchar
        struct_id: varchar
        kind: varchar
        approved_at: timestamp
        snap_botanical: varchar
        snap_dbh_cm: integer
        snap_address: integer
        snap_street: varchar
        snap_lon: double
        snap_lat: double
        new_botanical: varchar
        new_dbh_cm: integer
        new_address: integer
        new_street: varchar
        # An address fix moves the dot: the City places every tree at its address, so the
        # new position is worked out from the corrected address at approval time.
        new_lon: double
        new_lat: double
        new_ward: varchar
        # Additions only: trees of the added tree's genus the City had at its address
        # when it was reported, so a refresh that adds it too can be recognised. -1: unknown.
        snap_count: integer
