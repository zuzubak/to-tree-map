version: 2

sources:
  - name: raw
    schema: raw
    description: Tables loaded by ingest/ straight from the City of Toronto's CKAN API.
    tables:
      - name: street_trees
        description: One row per inventoried street tree, geometry already unpacked to lon/lat.
      - name: wards
        description: Ward code and name, for labelling.
      - name: source_metadata
        description: The City's own last_refreshed stamp plus which ingest route was used.

  - name: geo
    schema: geo
    description: Street network, census geography, and the tree-to-geography joins, built by analysis/ingest_geo.py.
    tables:
      - name: street_segments
      - name: dissemination_areas
      - name: tree_area
      - name: tree_segment
      - name: segment_crossings
      - name: former_municipalities
      - name: da_municipality
      - name: segment_area
